<svg width="840" height="240" viewBox="0 0 840 240" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .drop { opacity: 0; animation: drop .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .m0 { animation-delay: .1s } .m1 { animation-delay: .4s } .m2 { animation-delay: .7s } .m3 { animation-delay: 1s }
    .ln { opacity: 0; animation: show .3s ease-out forwards; }
    .flow { stroke-dasharray: 3 4; animation: flow 1s linear infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes drop  { from { opacity: 0; transform: translateY(-18px) } to { opacity: 1; transform: none } }
    @keyframes show  { to { opacity: 1 } }
    @keyframes flow  { to { stroke-dashoffset: -14 } }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important } }
  </style>

  <rect width="840" height="240" rx="12" fill="#0D1117" stroke="#1d2b24"/>

  <!-- abstraction stack (bottom → top) -->
  <g class="drop m0">
    <polygon points="70,184 170,166 270,184 170,202" fill="#000d09" stroke="#005533"/>
    <text x="170" y="188" font-size="10" fill="#2f7a5a" text-anchor="middle">M0 — Runtime instances</text>
  </g>
  <g class="drop m1">
    <polygon points="80,142 170,124 260,142 170,160" fill="#001a11" stroke="#008855"/>
    <text x="170" y="146" font-size="10" fill="#00aa6a" text-anchor="middle">M1 — Model</text>
  </g>
  <g class="drop m2">
    <polygon points="90,100 170,82 250,100 170,118" fill="#003322" stroke="#00cc88"/>
    <text x="170" y="104" font-size="10" fill="#00cc88" text-anchor="middle">M2 — Metamodel</text>
  </g>
  <g class="drop m3">
    <polygon points="100,58 170,40 240,58 170,76" fill="#004d33" stroke="#00FFB3"/>
    <text x="170" y="62" font-size="10" fill="#00FFB3" text-anchor="middle">M3 — Meta-metamodel</text>
  </g>
  <text x="285" y="58" font-size="9" fill="#4b6358">conformsTo</text>
  <line x1="276" y1="62" x2="276" y2="180" stroke="#00FFB3" stroke-opacity=".6" class="flow"/>
  <polygon points="272,178 276,186 280,178" fill="#00FFB3" fill-opacity=".6"/>

  <!-- terminal -->
  <rect x="360" y="18" width="460" height="204" rx="8" fill="#0a0f0a" stroke="#00FFB3" stroke-opacity=".7"/>
  <circle cx="378" cy="33" r="4.5" fill="#ff5f56"/><circle cx="393" cy="33" r="4.5" fill="#ffbd2e"/><circle cx="408" cy="33" r="4.5" fill="#27c93f"/>
  <text x="590" y="37" font-size="10" fill="#4b6358" text-anchor="middle">metamodelo_metametamodelo</text>
  <line x1="360" y1="46" x2="820" y2="46" stroke="#16211b"/>

  <g font-size="11" xml:space="preserve">
    <text x="378" y="70"  fill="#00FFB3" class="ln" style="animation-delay:.3s">$ cat project.info</text>
    <text x="378" y="92"  fill="#88ffcc" class="ln" style="animation-delay:.7s">▸ Stack    TypeScript · EMF-style patterns</text>
    <text x="378" y="110" fill="#88ffcc" class="ln" style="animation-delay:.9s">▸ Domain   Model-Driven Engineering (MDE)</text>
    <text x="378" y="128" fill="#88ffcc" class="ln" style="animation-delay:1.1s">▸ Layers   M3 → M2 → M1 → M0</text>
    <text x="378" y="146" fill="#88ffcc" class="ln" style="animation-delay:1.3s">▸ Focus    Abstraction · Conformance checks</text>
    <text x="378" y="172" fill="#00FFB3" class="ln" style="animation-delay:1.7s">$ git status</text>
    <text x="378" y="190" fill="#44aa77" class="ln" style="animation-delay:2s">On branch main — working tree clean</text>
    <text x="378" y="210" fill="#00FFB3" class="ln" style="animation-delay:2.2s">$ <tspan class="cur">▌</tspan></text>
  </g>
</svg>

<svg width="840" height="240" viewBox="0 0 840 240" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .6s ease-out forwards; }
    .ln { opacity: 0; animation: show .3s ease-out forwards; }
    .tick { stroke-dasharray: 2 6; animation: flow .8s linear infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
    @keyframes show  { to { opacity: 1 } }
    @keyframes flow  { to { stroke-dashoffset: 16 } }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important } }
  </style>

  <rect width="840" height="240" rx="12" fill="#0D1117" stroke="#1d2b24"/>

  <!-- layers (bottom → top, boot order) -->
  <g class="rise" style="animation-delay:.1s">
    <polygon points="40,200 170,182 300,200 170,218" fill="#141100" stroke="#FFD700"/>
    <text x="170" y="204" font-size="10" fill="#FFD700" text-anchor="middle">HARDWARE</text>
  </g>
  <g class="rise" style="animation-delay:.4s">
    <polygon points="52,162 170,144 288,162 170,180" fill="#001a00" stroke="#00cc44"/>
    <text x="170" y="166" font-size="10" fill="#00cc44" text-anchor="middle">KERNEL · scheduler · memory</text>
  </g>
  <g class="rise" style="animation-delay:.7s">
    <polygon points="64,124 170,106 276,124 170,142" fill="#001a11" stroke="#00FFB3"/>
    <text x="170" y="128" font-size="10" fill="#00FFB3" text-anchor="middle">SYSTEM CALLS</text>
  </g>
  <g class="rise" style="animation-delay:1s">
    <polygon points="76,86 170,68 264,86 170,104" fill="#002918" stroke="#69F0AE"/>
    <text x="170" y="90" font-size="10" fill="#69F0AE" text-anchor="middle">USER SPACE</text>
  </g>
  <line x1="306" y1="86" x2="306" y2="200" stroke="#00FFB3" stroke-opacity=".5" class="tick"/>

  <!-- process states cycling (round-robin) -->
  <g font-size="9" font-weight="bold" text-anchor="middle">
    <text x="40" y="34" font-size="9" font-weight="normal" fill="#4b6358" text-anchor="start">PID 1 · 2 · 3   R=run W=wait S=sleep</text>
    <rect x="40" y="42" width="22" height="16" rx="3" fill="#00FFB3">
      <animate attributeName="fill" values="#00FFB3;#FFD700;#30363d;#00FFB3" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="68" y="42" width="22" height="16" rx="3" fill="#FFD700">
      <animate attributeName="fill" values="#FFD700;#30363d;#00FFB3;#FFD700" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="96" y="42" width="22" height="16" rx="3" fill="#30363d">
      <animate attributeName="fill" values="#30363d;#00FFB3;#FFD700;#30363d" dur="3s" repeatCount="indefinite"/></rect>
    <text x="51" y="53" fill="#0D1117">1</text><text x="79" y="53" fill="#0D1117">2</text><text x="107" y="53" fill="#0D1117">3</text>
  </g>

  <!-- terminal -->
  <rect x="360" y="18" width="460" height="204" rx="8" fill="#0a0f0a" stroke="#00FFB3" stroke-opacity=".7"/>
  <circle cx="378" cy="33" r="4.5" fill="#ff5f56"/><circle cx="393" cy="33" r="4.5" fill="#ffbd2e"/><circle cx="408" cy="33" r="4.5" fill="#27c93f"/>
  <text x="590" y="37" font-size="10" fill="#4b6358" text-anchor="middle">mini_os</text>
  <line x1="360" y1="46" x2="820" y2="46" stroke="#16211b"/>

  <g font-size="11" xml:space="preserve">
    <text x="378" y="70"  fill="#00FFB3" class="ln" style="animation-delay:.3s">$ python mini_os.py --boot</text>
    <text x="378" y="92"  fill="#88ffcc" class="ln" style="animation-delay:.7s">▸ Layers     User → Syscall → Kernel → HW</text>
    <text x="378" y="110" fill="#88ffcc" class="ln" style="animation-delay:.9s">▸ Scheduler  Round-Robin · Priority</text>
    <text x="378" y="128" fill="#88ffcc" class="ln" style="animation-delay:1.1s">▸ Memory     Paging + allocation sim</text>
    <text x="378" y="152" fill="#44aa77" class="ln" style="animation-delay:1.6s">[ ok ] kernel loaded</text>
    <text x="378" y="170" fill="#44aa77" class="ln" style="animation-delay:1.9s">[ ok ] PID 1 init   RUNNING</text>
    <text x="378" y="188" fill="#44aa77" class="ln" style="animation-delay:2.2s">[ ok ] PID 2 shell  WAITING</text>
    <text x="378" y="210" fill="#00FFB3" class="ln" style="animation-delay:2.5s">$ <tspan class="cur">▌</tspan></text>
  </g>
</svg>

<svg width="840" height="240" viewBox="0 0 840 240" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ln { opacity: 0; animation: show .3s ease-out forwards; }
    .best { stroke-dasharray: 6 5; animation: flow 1.2s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes show  { to { opacity: 1 } }
    @keyframes flow  { to { stroke-dashoffset: -22 } }
    @keyframes pulse { 0%,100% { stroke-opacity: .25 } 50% { stroke-opacity: .7 } }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important } }
  </style>

  <rect width="840" height="240" rx="12" fill="#0D1117" stroke="#1d2b24"/>

  <!-- pheromone trails (width = strength) -->
  <line x1="90" y1="80"  x2="110" y2="170" stroke="#00cc88" stroke-width="1"   class="pulse"/>
  <line x1="130" y1="175" x2="200" y2="140" stroke="#4FC3F7" stroke-width="1"   class="pulse"/>
  <line x1="120" y1="72" x2="240" y2="52"  stroke="#FFD700" stroke-width="1.6" class="pulse"/>
  <line x1="120" y1="80" x2="190" y2="125" stroke="#00FFB3" stroke-width="3"   stroke-opacity=".5"/>
  <line x1="225" y1="125" x2="265" y2="70" stroke="#FFD700" stroke-width="2.6" stroke-opacity=".5"/>

  <!-- best route -->
  <path id="route" d="M90,80 L205,135 L265,58" fill="none" stroke="#ff7a45" stroke-width="1.6" class="best"/>
  <!-- ants -->
  <circle r="3.5" fill="#ff7a45"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
  <circle r="2.5" fill="#ffb38a"><animateMotion dur="3s" begin="1s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
  <circle r="2.5" fill="#ffb38a"><animateMotion dur="3s" begin="2s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>

  <!-- nodes -->
  <g font-size="9" text-anchor="middle">
    <polygon points="60,72 90,58 120,72 90,86" fill="#002918" stroke="#00FFB3"/>
    <polygon points="60,72 60,90 90,104 90,86" fill="#001408" stroke="#00FFB3"/>
    <polygon points="90,86 120,72 120,90 90,104" fill="#001d0e" stroke="#00FFB3"/>
    <text x="90" y="76" fill="#00FFB3">SRV-A</text>

    <polygon points="175,128 205,114 235,128 205,142" fill="#1a1a00" stroke="#FFD700"/>
    <polygon points="175,128 175,146 205,160 205,142" fill="#141400" stroke="#FFD700"/>
    <polygon points="205,142 235,128 235,146 205,160" fill="#1a1a00" stroke="#FFD700"/>
    <text x="205" y="132" fill="#FFD700">SRV-B</text>

    <polygon points="80,175 110,161 140,175 110,189" fill="#00101a" stroke="#4FC3F7"/>
    <polygon points="80,175 80,193 110,207 110,189" fill="#000a12" stroke="#4FC3F7"/>
    <polygon points="110,189 140,175 140,193 110,207" fill="#001522" stroke="#4FC3F7"/>
    <text x="110" y="179" fill="#4FC3F7">SRV-C</text>

    <polygon points="235,52 265,38 295,52 265,66" fill="#1a001a" stroke="#CE93D8"/>
    <polygon points="235,52 235,70 265,84 265,66" fill="#110011" stroke="#CE93D8"/>
    <polygon points="265,66 295,52 295,70 265,84" fill="#160016" stroke="#CE93D8"/>
    <text x="265" y="56" fill="#CE93D8">DEST</text>
  </g>
  <text x="40" y="226" font-size="9" fill="#4b6358">line width = pheromone level · orange = best route</text>

  <!-- terminal -->
  <rect x="360" y="18" width="460" height="204" rx="8" fill="#0a0f0a" stroke="#00FFB3" stroke-opacity=".7"/>
  <circle cx="378" cy="33" r="4.5" fill="#ff5f56"/><circle cx="393" cy="33" r="4.5" fill="#ffbd2e"/><circle cx="408" cy="33" r="4.5" fill="#27c93f"/>
  <text x="590" y="37" font-size="10" fill="#4b6358" text-anchor="middle">ACO_Server_Routing</text>
  <line x1="360" y1="46" x2="820" y2="46" stroke="#16211b"/>

  <g font-size="11" xml:space="preserve">
    <text x="378" y="70"  fill="#00FFB3" class="ln" style="animation-delay:.3s">$ python aco.py --nodes 4 --iters 200</text>
    <text x="378" y="92"  fill="#88ffcc" class="ln" style="animation-delay:.7s">▸ Algorithm  Ant Colony Optimization</text>
    <text x="378" y="110" fill="#88ffcc" class="ln" style="animation-delay:.9s">▸ Problem    Server routing</text>
    <text x="378" y="128" fill="#88ffcc" class="ln" style="animation-delay:1.1s">▸ Objective  Minimize total latency</text>
    <text x="378" y="146" fill="#88ffcc" class="ln" style="animation-delay:1.3s">▸ Stack      Python · Graphs · Heuristics</text>
    <text x="378" y="172" fill="#44aa77" class="ln" style="animation-delay:1.8s">✓ pheromone matrix converged</text>
    <text x="378" y="190" fill="#44aa77" class="ln" style="animation-delay:2.1s">✓ best route: SRV-A → SRV-B → DEST</text>
    <text x="378" y="210" fill="#00FFB3" class="ln" style="animation-delay:2.4s">$ <tspan class="cur">▌</tspan></text>
  </g>
</svg>
